<!doctype html>
<meta charset="utf-8">
<title>SONIX</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <header>
    <span class="mark"></span>
    <h1>SONIX</h1>
    <span class="ver">0.1.0</span>
  </header>

  <div class="band" id="band">
    <div class="band-label" id="bandLabel">Not monitoring</div>
    <div class="band-sub" id="bandSub">Open a Google Meet call, then start.</div>
  </div>

  <div id="pairing" class="pairing" hidden>
    <div class="k">Pairing code</div>
    <div class="code" id="code">------</div>
    <div class="hint" id="codeHint">Approve it on the SONIX dashboard — click to copy.</div>
  </div>

  <dl class="stats">
    <div><dt>Call</dt><dd id="callId">—</dd></div>
    <div><dt>State</dt><dd id="callState">—</dd></div>
    <div><dt>Windows</dt><dd id="windows">0</dd></div>
  </dl>

  <label class="field">
    <span class="field-head">
      <span class="dot" id="serverDot"></span>
      <span>Server</span>
      <button type="button" class="linkbtn" id="serverReset">reset</button>
    </span>
    <input id="server" type="text" value="http://localhost:8000" spellcheck="false"
           autocomplete="off">
  </label>
  <p class="band-sub" id="serverMsg" style="margin:-6px 0 11px;font-size:10.5px"></p>

  <label class="field">
    <span class="field-head"><span>Detection head</span></span>
    <select id="model"><option value="">Default</option></select>
  </label>

  <button id="toggle">Start monitoring</button>

  <!-- Separate from the toggle on purpose. The toggle is the normal
       lifecycle; this one exists for when Chrome still holds a capture
       stream the extension has lost track of, which is what produces
       "Cannot capture a tab with an active stream." -->
  <button id="forceStop" class="ghost">Force-stop capture stream</button>

  <p class="err" id="err" hidden></p>
  <p class="note">Captures this tab's audio — the other participants, not your
    microphone. Tell them they are being monitored.</p>
</div>
<script src="popup.js"></script>
